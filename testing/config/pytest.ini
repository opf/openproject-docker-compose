[tool:pytest]
minversion = 6.0
addopts = 
    -ra 
    --strict-markers 
    --strict-config 
    --disable-warnings
    --tb=short
testpaths = ../unit ../integration ../e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (component interactions)
    e2e: End-to-end tests (full workflows)
    docker: Tests requiring Docker
    orchestration: Docker Compose orchestration tests
    config: Configuration management tests
    deployment: Deployment orchestration tests
    slow: Slow running tests

# Test discovery patterns
collect_ignore = ["setup.py"]

# Coverage settings
[coverage:run]
source = src/openproject_deploy
omit = 
    */testing/*
    */test_*
    setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod