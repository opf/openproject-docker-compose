version: '3.8'

x-op-restart-policy: &restart_policy
  restart: unless-stopped
x-op-image: &image
  image: openproject/openproject:${TAG:-16-slim}
x-op-app: &app
  <<: [ *image, *restart_policy ]
  environment:
    OPENPROJECT_HTTPS: "${OPENPROJECT_HTTPS:-true}"
    OPENPROJECT_HOST__NAME: "${OPENPROJECT_HOST__NAME:-localhost:8080}"
    OPENPROJECT_HSTS: "${OPENPROJECT_HSTS:-true}"
    RAILS_CACHE_STORE: "memcache"
    OPENPROJECT_CACHE__MEMCACHE__SERVER: "cache:11211"
    OPENPROJECT_RAILS__RELATIVE__URL__ROOT: "/openproject"
    DATABASE_URL: "${DATABASE_URL:-postgres://postgres:p4ssw0rd@db/openproject?pool=20&encoding=unicode&reconnect=true}"
    RAILS_MIN_THREADS: ${RAILS_MIN_THREADS:-4}
    RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-16}
    IMAP_ENABLED: "${IMAP_ENABLED:-false}"
  volumes:
    - "${OPDATA:-./data/opdata}:/var/openproject/assets"
  networks:
    - backend
    - frontend

services:
  # --- Shared Infrastructure ---
  db:
    image: postgres:13
    <<: *restart_policy
    stop_grace_period: "3s"
    volumes:
      - "${PGDATA:-./data/pgdata}:/var/lib/postgresql/data"
      - ./init-db:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-p4ssw0rd}
      POSTGRES_DB: openproject # Default DB
    networks:
      - backend

  cache:
    image: memcached
    <<: *restart_policy
    networks:
      - backend

  # --- OpenProject Services ---
  web:
    <<: *app
    command: "./docker/prod/web"
    depends_on:
      - db
      - cache
      - seeder
    labels:
      - autoheal=true
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/openproject/health_checks/default" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  worker:
    <<: *app
    command: "./docker/prod/worker"
    depends_on:
      - db
      - cache
      - seeder

  cron:
    <<: *app
    command: "./docker/prod/cron"
    depends_on:
      - db
      - cache
      - seeder

  seeder:
    <<: *app
    command: "./docker/prod/seeder"
    restart: on-failure
    depends_on:
      - db

  # --- Mattermost (Chat) ---
  mattermost:
    image: mattermost/mattermost-team-edition:9.5
    restart: unless-stopped
    environment:
      - MM_SQLSETTINGS_DRIVERNAME=postgres
      - MM_SQLSETTINGS_DATASOURCE=postgres://postgres:p4ssw0rd@db/mattermost?sslmode=disable&connect_timeout=10
      - MM_SERVICESETTINGS_SITEURL=https://${DOMAIN}/chat
      - MM_SERVICESETTINGS_LISTENADDRESS=:8065
    volumes:
      - ./data/mattermost/config:/mattermost/config:rw
      - ./data/mattermost/data:/mattermost/data:rw
    networks:
      - backend
      - frontend
    depends_on:
      - db

  # --- BookStack (Knowledge) ---
  bookstack:
    image: lscr.io/linuxserver/bookstack:latest
    container_name: bookstack
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - APP_URL=https://${DOMAIN}/wiki
      - APP_KEY=base64:dkMzWXbMrrtNxVheqy17mcaBVl+RzGODbiWYcFnSqow=
      - DB_HOST=bookstack_db
      - DB_USERNAME=bookstack
      - DB_PASSWORD=p4ssw0rd
      - DB_DATABASE=bookstackapp
    volumes:
      - ./data/bookstack/config:/config
    ports:
      - 6875:80
    restart: unless-stopped
    depends_on:
      - bookstack_db
    networks:
      - frontend
      - backend

  bookstack_db:
    image: lscr.io/linuxserver/mariadb:latest
    container_name: bookstack_db
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - MYSQL_ROOT_PASSWORD=p4ssw0rd
      - MYSQL_DATABASE=bookstackapp
      - MYSQL_USER=bookstack
      - MYSQL_PASSWORD=p4ssw0rd
    volumes:
      - ./data/bookstack/db:/config
    restart: unless-stopped
    networks:
      - backend

  # --- Excalidraw (Ideation) ---
  excalidraw:
    build: ./excalidraw
    restart: unless-stopped
    networks:
      - frontend
    environment:
      - VITE_APP_BASE_PATH=/ideation/
      - VITE_APP_WS_SERVER_PATH=/ideation/socket.io/
    healthcheck:
      disable: true

  # --- Gateway / Proxy ---
  proxy:
    build:
      context: ./proxy
      args:
        APP_HOST: web
    image: openproject/proxy
    environment:
      - DOMAIN=${DOMAIN}
      - GATEWAY_USER=${GATEWAY_USER:-admin}
      - GATEWAY_PASSWORD_HASH=${GATEWAY_PASSWORD_HASH} # Bcrypt hash
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - caddy_data:/data
    depends_on:
      - web
      - mattermost
      - bookstack
      # - excalidraw  # Temporarily disabled
    networks:
      - frontend

  # --- Cloudflare Tunnel ---
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://proxy:80
    networks:
      - frontend
    depends_on:
      - proxy

  autoheal:
    image: willfarrell/autoheal:1.2.0
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_START_PERIOD: 600
      AUTOHEAL_INTERVAL: 30

networks:
  frontend:
  backend:


volumes:
  pgdata:
  opdata:
  caddy_data:
