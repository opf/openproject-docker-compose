# docker-compose.yml CORRIGIDO para rodar na porta 3033 com Coolify

networks:
  frontend:
  backend:

volumes:
  pgdata:
  opdata:

x-op-restart-policy: &restart_policy
  restart: unless-stopped
x-op-image: &image
  image: openproject/openproject:15-slim
x-op-app: &app
  <<: [*image, *restart_policy]
  environment:
    # As variáveis de ambiente do seu arquivo .env serão injetadas aqui pelo Coolify
    # Garanta que PORT=3033 esteja no .env ou nas variáveis de ambiente do Coolify
    OPENPROJECT_HTTPS: "true"
    OPENPROJECT_HOST__NAME: "projetos.sudu.dev"
    OPENPROJECT_HSTS: "true"
    RAILS_CACHE_STORE: "memcache"
    OPENPROJECT_CACHE__MEMCACHE__SERVER: "cache:11211"
    DATABASE_URL: "postgres://postgres:p4ssw0rd@db/openproject?pool=20&encoding=unicode&reconnect=true"
    RAILS_MIN_THREADS: 4
    RAILS_MAX_THREADS: 16
    PORT: 3000
  volumes:
    - "opdata:/var/openproject/assets"

services:
  db:
    image: postgres:13
    <<: *restart_policy
    stop_grace_period: "3s"
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-p4ssw0rd}
      POSTGRES_DB: openproject
    networks:
      - backend

  cache:
    image: memcached
    <<: *restart_policy
    networks:
      - backend

  web:
    <<: *app
    # SOBRESCREVENDO O COMANDO PARA USAR A PORTA DEFINIDA PELA VARIÁVEL PORT
    command: "bundle exec rails server -b 0.0.0.0" 
    ports:
      # EXPONDO A PORTA INTERNA PARA O COOLIFY
      - "3000"
    networks:
      - frontend
      - backend
    depends_on:
      - db
      - cache
      - seeder
    healthcheck:
      # ATUALIZANDO O HEALTHCHECK PARA A PORTA CORRETA
      test: ["CMD", "curl", "-f", "http://localhost:3000${OPENPROJECT_RAILS__RELATIVE__URL__ROOT:-}/health_checks/default"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
  
  # Outros serviços (worker, cron, etc.) podem ser mantidos como estavam, pois não precisam de porta externa.
  worker:
    <<: *app
    command: "./docker/prod/worker"
    networks:
      - backend
    depends_on:
      - db
      - cache
      - seeder

  cron:
    <<: *app
    command: "./docker/prod/cron"
    networks:
      - backend
    depends_on:
      - db
      - cache
      - seeder

  seeder:
    <<: *app
    command: "./docker/prod/seeder"
    restart: on-failure
    networks:
      - backend